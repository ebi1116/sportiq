<div class="row g-3">{% for f in form %}<div class="col-6 {% if f.name == 'photo' or f.name == 'full_name' or f.name == 'opponent' or f.name == 'venue' or f.name == 'bowling_style' %}col-12{% endif %}"><label class="d-block mb-1">{{ f.label }}</label>{{ f }}{% if f.name == 'photo' %}<div class="form-help">Choose a JPG, PNG, or WebP image, then drag to position it and zoom to adjust the crop.</div><div class="photo-adjust" id="photo-adjust" hidden><canvas id="photo-crop" width="260" height="260" aria-label="Adjust profile photo crop. Drag the image to reposition it."></canvas><label for="photo-zoom">Zoom</label><input id="photo-zoom" type="range" min="1" max="3" step="0.01" value="1" aria-label="Zoom profile photo"></div>{% endif %}{% for e in f.errors %}<div class="text-danger small">{{ e }}</div>{% endfor %}</div>{% endfor %}</div>
